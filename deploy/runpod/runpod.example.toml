# Copy beside your normal config as runpod.local.toml (ignored by Git).
# Account and Ceph credentials stay in the normal config. This file changes
# only the remote deployment. The CLI checks live availability and GPU price.
[runpod]
name = "epub-tts-narrator"
# Verified Runpod base 1.0.7, CUDA 12.9, Linux x86_64; SSH enabled by the CLI.
image = "runpod/base@sha256:c776d549e38023c51a28c25267e029ec2aa53a525c87a934b77694d76572c629"
gpu_type_id = "NVIDIA H100 80GB HBM3"
data_center_id = "US-MO-1"
max_hourly_price = 4.10
volume_size_gb = 150
container_disk_gb = 30
state_dir = "./dist/runpod"
startup_timeout_seconds = 900
# The pinned base image uses 8081 for nginx; keep the chapter service separate.
service_port = 8082
idle_timeout_seconds = 600
github_url = "https://github.com/taxilian/epub-tts-narrator.git"
git_ref = "main"
# Opt in after benchmarking your GPU. Both backends load one Drama 3 model.
# tts_backend = "sglang"   # default: native (serial inference)
# tts_concurrency = 4      # SGLang requests in flight; 1–8, not model copies
# sglang_source = "/workspace/sglang-omni"

# Optional remote-specific changes are merged into normal rendering settings.
# [verification]
# cpu_threads = 8
# device = "cuda"         # default: cpu; one shared Whisper model on GPU 0
# compute_type = "int8_float16" # CUDA default; CPU default is int8

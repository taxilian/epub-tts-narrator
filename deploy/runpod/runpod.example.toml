# Copy beside your normal config as runpod.local.toml (ignored by Git).
# Account and Ceph credentials stay in the normal config. This file changes
# only the remote deployment. The CLI checks live availability and GPU price.
[runpod]
name = "epub-tts-narrator"
# Verified Runpod base 1.0.7, CUDA 12.9, Linux x86_64; SSH enabled by the CLI.
image = "runpod/base@sha256:c776d549e38023c51a28c25267e029ec2aa53a525c87a934b77694d76572c629"
# Any NVIDIA GPU with at least this much memory is eligible (one Drama 3
# copy needs about 48 GB plus Whisper). GPUs with a measured throughput (the
# RTX PRO 6000) rank first by cost per generated audio hour, then the rest by
# price. Set gpu_type_id to an exact catalog ID only to pin one GPU.
min_gpu_memory_gb = 56
# gpu_type_id = "NVIDIA RTX PRO 6000 Blackwell Server Edition"
# Runpod clouds in preference order. The first cloud with an eligible GPU
# wins; a confirmed refusal falls back once to the next. ["secure"] (the
# default) never uses Community Cloud.
cloud_types = ["community", "secure"]
# Optional location hint only. Every allocation searches all US datacenters
# in the cloud's live catalog under the same GPU/price policy; this hint only
# breaks ties. Empty or stale values are ignored, never errors.
data_center_id = "US-MO-1"
max_hourly_price = 2.60
# Host-local Pod disk mounted at /workspace. It survives stop/start on the
# same host and is discarded with the Pod; a new Pod is fully reprovisioned.
# It is billed while the Pod exists, including while stopped.
volume_size_gb = 150
container_disk_gb = 30
state_dir = "./dist/runpod"
startup_timeout_seconds = 900
# The pinned base image uses 8081 for nginx; keep the chapter service separate.
# Ports 8080 and 8090-8092 are reserved for the private Drama 3 copies.
service_port = 8082
# Independent Drama 3 copies on the one GPU (about 48 GB each while generating);
# measured: no gain without MPS, about +25% with it. More than one needs
# min_gpu_memory_gb of at least 48 per copy. inference_mps lets the copies
# share the GPU through NVIDIA MPS.
# inference_replicas = 2
# inference_mps = true
# Batched decoding: one copy advances up to this many passages per step
# (default 1; not combinable with inference_replicas above 1). EXPERIMENTAL:
# some passages run on; see the deployment README before enabling.
# inference_batch_rows = 8
idle_timeout_seconds = 300
github_url = "https://github.com/taxilian/epub-tts-narrator.git"
git_ref = "main"
# Opt in after benchmarking your GPU. Both backends load one Drama 3 model.

# Optional remote-specific changes are merged into normal rendering settings.
# [verification]
# cpu_threads = 8
# device = "cuda"         # default: cpu; one shared Whisper model on GPU 0
# compute_type = "int8_float16" # CUDA default; CPU default is int8
# reference_model = "on"  # any value prepares the same pinned Whisper into
                          # [runpod].reference_whisper_dir for corroboration

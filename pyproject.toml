[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-tts-narrator"
version = "0.1.0"
description = "Analyze EPUB books, cast reusable voices, and render verified multi-voice audiobooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
epub-tts-narrator = "epub_audiobook.cli:main"
# Compatibility with existing commands and scripts.
epub-audiobook = "epub_audiobook.cli:main"
audiobook-render = "audiobook_renderer.cli:main"

[project.urls]
Repository = "https://github.com/taxilian/epub-tts-narrator"

[tool.setuptools.packages.find]
include = ["epub_audiobook*", "audiobook_renderer*"]

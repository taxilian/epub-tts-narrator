[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-tts-narrator"
version = "0.1.0"
description = "Analyze EPUB books, cast reusable voices, and render verified multi-voice audiobooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
epub-tts-narrator = "epub_tts_narrator.cli:main"
# Compatibility with existing commands and scripts.
epub-audiobook = "epub_tts_narrator.cli:main"
audiobook-render = "epub_tts_narrator.renderer.cli:main"

[project.urls]
Repository = "https://github.com/taxilian/epub-tts-narrator"

[tool.setuptools.packages.find]
include = ["epub_tts_narrator", "epub_tts_narrator.*"]

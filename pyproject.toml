[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-tts-narrator"
version = "0.1.0"
description = "Analyze EPUB books, cast reusable voices, and render verified multi-voice audiobooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
verification = ["Metaphone==0.6"]
remote = ["msgpack>=1.1,<2", "websockets>=15,<16"]
chapter-server = ["msgpack>=1.1,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "boto3>=1.35,<2"]
# Released faster-whisper decoders use av.open(metadata_errors=...), removed in PyAV 19.
# Full-screen terminal interfaces (casting); every command keeps its line interface without it.
tui = ["textual>=8.2,<9"]
cuda-verification = ["faster-whisper>=1.1,<2", "av>=11,<19", "Metaphone==0.6"]

[project.scripts]
epub-tts-narrator = "epub_tts_narrator.cli:main"
# Compatibility with existing commands and scripts.
epub-audiobook = "epub_tts_narrator.cli:main"
audiobook-render = "epub_tts_narrator.renderer.cli:main"

[project.urls]
Repository = "https://github.com/taxilian/epub-tts-narrator"

[tool.setuptools.packages.find]
include = ["epub_tts_narrator", "epub_tts_narrator.*"]

[tool.setuptools.package-data]
epub_tts_narrator = ["data/cmudict.dict.gz", "data/CMUDICT-LICENSE", "data/CMUDICT-PROVENANCE.md"]

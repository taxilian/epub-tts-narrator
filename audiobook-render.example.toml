# Renderer sections for the global epub-tts-narrator.toml.
# Append these to the analyzer settings once; both commands read that file.
# Book paths and series IDs come from the analyzed book directory.

# Optional Hugging Face credential for prompted model downloads. Empty means anonymous.
# Keep your real key in the ignored global config; environment tokens are not used.
[huggingface]
api_key = ""

[engine]
type = "drama3_mlx"
checkpoint = "./models/drama-3"
experts = "q8"
temperature = 1.0
top_p = 0.9
top_k = 30
max_new_tokens = 2048

# Optional distributed speech generation. With no workers, use [engine] normally.
# All configured workers receive the same saved voice recordings and transcripts.
# Keep these worker tables commented until the corresponding servers are running.
# [render_pool]
# model_revision = "b2b5ee998034b2975720906c815e7fb0e9f007bd"
# [[render_pool.workers]]
# name = "local"
# type = "local"
# concurrency = 1
# [[render_pool.workers]]
# name = "second-mac"
# type = "fish_http"
# url = "http://second-mac.local:8080/v1/tts"
# api_key = "YOUR_SHARED_SERVER_KEY"
# model = "drama-3"
# concurrency = 1
# timeout_seconds = 300
# multi_speaker = true
# Add more fish_http tables for compatible HTTPS cloud endpoints.
# Set multi_speaker=false if an endpoint lacks Drama 3 speaker-tag support.

# Only used by `audiobook-render serve`, on a Mac providing local Drama 3.
# Bind to 0.0.0.0 for LAN access and set a shared key in this file and its clients.
[server]
host = "127.0.0.1"
port = 8080
api_key = ""
max_pending_requests = 4
request_timeout_seconds = 300
max_request_bytes = 104857600

[voice_design]
# Prefer Gemini when its API key is configured; otherwise create voices locally.
# Drama 3 still synthesizes audiobook speech by cloning the saved recordings.
# Use "engine" for local creation, "gemini" for Gemini, or "elevenlabs" for ElevenLabs.
type = "auto"

[verification]
type = "mlx_whisper"
model = "./models/whisper-large-v3-turbo"
language = "en"
# Optional second recognizer for small wording discrepancies in voice samples.
# Download the model first; book passages always use the strict speech policy.
# reference_model = "./models/parakeet-tdt-0.6b-v3"

# Optional global JEV section, already included in epub-tts-narrator.example.toml.
# Keep exactly one [jev] table in the combined config; uncomment only if absent.
# Checks every bounded changed phrase after complete alignment and independent ASR.
# Only changed phrases and short source context are sent to JEV.
# No audio is sent, and audiobook passage verification remains unchanged.
# [jev]
# enabled = false
# api_key = "YOUR_JEV_API_KEY"
# model = "jev-latest"
# Pin an evaluated model version for repeatability.
# timeout_seconds = 30
# threshold = 0.90

[voices]
# Scripts use substantial source excerpts or prepared character-specific text.
# This legacy setting is not a generic fallback in the book workflow.
# Explicit user-edited casting scripts take precedence.
# Voices are written beneath <book-directory>/voices.
# Continued books inherit the nearest saved voice in their parent-book chain.
reference_text = "The morning light fell across the quiet room. I opened the door and listened to the wind in the trees. There was still time to decide what to do next."

# Used automatically for voice creation when api_key is set, and by GG in the menu.
# Keep the real key in your ignored local epub-tts-narrator.toml.
[gemini]
api_key = ""
model = "gemini-3.8-flash-tts"
language_code = "en-US"
timeout_seconds = 180.0

# Optional alternate designer, selected with G11 in the menu.
# Adding its key does not change automatic voice creation; set
# [voice_design] type = "elevenlabs" to use it for all new voices.
[elevenlabs]
api_key = ""
model = "eleven_ttv_v3"
timeout_seconds = 180.0
guidance_scale = 5.0
loudness = 0.0

[casting]
# Executable and arguments; the sample's absolute path is appended. No shell.
player = ["/usr/bin/afplay"]
# For another platform: ["ffplay", "-nodisp", "-autoexit", "-loglevel", "error"]
# Match perceived loudness for auditions; immutable cloning references stay untouched.
normalize_samples = true
sample_loudness_lufs = -20.0
sample_true_peak_db = -1.5

[render]
# Defaults: <book-directory>/render-work and <book-directory>/audiobook.
# Override per run with --work-dir and -o/--output.
chapter_format = "m4a" # or "mp3"; final book is AAC in an .m4b container
aac_bitrate = "128k"
mp3_bitrate = "128k"
# Match completed chapters' loudness while preserving their speech dynamics.
# Original voice references and verified speech clips remain unchanged.
normalize_loudness = true
target_lufs = -20.0
true_peak_db = -1.5
max_chunk_chars = 320
max_attempts = 3
seed = 1729
sample_rate = 44100
# All added pauses, in milliseconds (integers from 0 through 5000).
# With normalization enabled, these are total gap targets between audio clips:
# retained quiet edges count toward the gap, and overlapping cues use the largest.
# Pauses inside a continuous TTS-generated paragraph are unchanged.
normalize_pauses = true
sentence_pause_ms = 220  # After . ! ? or an ellipsis at a clip boundary
clause_pause_ms = 100    # After a comma, semicolon, colon, or dash at a clip boundary
paragraph_pause_ms = 250 # At a source paragraph boundary, including the chapter's final one
blank_pause_ms = 500     # Before a paragraph marked as following a blank line
bracket_pause_ms = 120   # On entering or leaving bracketed text
# Zero disables that added pause; it does not remove protected speech edges.
# normalize_pauses = false keeps original clip padding, disables sentence/clause
# targets, and adds paragraph/blank/bracket pauses on top of the existing padding.
# Remove redundant raw speech WAVs after a normalized take is accepted.
# Accepted clips stay reusable; voice samples and pending/failed requests stay intact.
# Set true only to retain raw engine output for debugging.
keep_intermediate_audio = false
allow_review = false
# Prefer --chapters 3 or --chapters 3-5,7 for per-book selections.
chapter_numbers = [] # all manifest script entries
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
# Pass --epub /path/to/book.epub to render to extract its original cover.

[quality]
max_wer = 0.0
min_duration_seconds = 0.08
max_duration_seconds = 120.0
min_rms_dbfs = -55.0
silence_threshold_dbfs = -60.0
max_silence_fraction = 0.85
max_internal_silence_seconds = 2.5
max_clipped_fraction = 0.20
